<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricci b-day!</title>
</head>
<style>
    * {
        box-sizing: border-box;
        padding: 0;
        margin: 0 auto;
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    }

    body {
        background-image: url('https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExaXI5MW5hZnhqNmNtODdqdmt3YzFxZTNpMGZvdGVpZ3o3dnBsajM0dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ECWLeGxcKasCc/giphy.gif');
        background-size: contain;
        background-position: center;
        background-repeat: repeat;
        height: 100vh;
        padding: 32px ;
        background-color: #f75296;
    }

    .blur {
        filter: blur(5px);
        padding: 10px;
    }

    div.gallery {
        border: 1px solid #f75296;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #ffffff;
        border-radius: 2rem;
        box-shadow: 2px 4px 10px 3px #ffffff79;
    }

    div.gallery:hover {
        border: 1px solid #f75296;
    }

    div.gallery img {
        width: 200px;
        height: auto;
    }

    div.desc {
        padding: 15px;
        text-align: center;
        color: #f75296;
        text-transform: uppercase;
        font-size: 1.5em;
    }

    .responsive {
        padding: 0 6px;
        width: 24.99999%;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    @media only screen and (max-width: 700px) {
        .responsive {
            width: 49.99999%;
            margin: 6px 0;
        }
    }

    @media only screen and (max-width: 500px) {
        .responsive {
            width: 100%;
        }
    }

    .clearfix:after {
        content: "";
        display: table;
        clear: both;
    }
</style>

<body>
    <div class="responsive">
        <div class="gallery">
            <a target="_blank" href="gift.jpg">
                <img src="gift.jpg" alt="Click here" class="blur">
            </a>
            <div class="desc">Click in the image to open your gift</div>
        </div>
        <audio controls>
  <source src="1to10.mp3" type="audio/mpeg">
  Your browser does not support the audio tag.
</audio>
    </div>
    <div class="clearfix"></div>
</body>

</html>
